#
# Nginx reverse proxy for Hefaistos
# - Proxies SPA frontend to the `frontend` service
# - Proxies API/GraphQL to the `backend` service

# Redirect HTTP to HTTPS
server {
    listen 8080;
    server_name localhost _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name localhost _;

    # SSL Certificates
    ssl_certificate /etc/nginx/certs/hefaistos.crt;
    ssl_certificate_key /etc/nginx/certs/hefaistos.key;

    # SSL Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Trust X-Forwarded-For only from the upstream Bunker WAF.
    # Do not trust broad internal ranges to avoid spoofed header chains.
    set_real_ip_from 65.108.145.215;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Use Docker's embedded DNS so hostnames (backend, frontend) are re-resolved
    # dynamically after container restarts instead of being cached at nginx startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Allow up to 10MB file uploads (AdvOps strAIn & Media)
    client_max_body_size 10M;

    # Common proxy headers
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- ATT&CK Navigator local config/data from shared volume ---
    location = /navigator/assets/config.json {
        alias /navigator-data/config.json;
        error_page 403 404 = @navigator_config_static;
    }

    location = /navigator/data/index.json {
        alias /navigator-data/data/index.json;
        error_page 403 404 = @navigator_index_static;
    }

    location /navigator/data/ {
        alias /navigator-data/data/;
    }

    location @navigator_config_static {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @navigator_index_static {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- FRONTEND (Main App) ---
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
    }

    # --- BACKEND ASGI WEBSOCKET (LSP proxy) ---
    location /ws/lsp/ {
        # Variable-based proxy_pass forces nginx to re-resolve via the resolver directive
        # on each request, preventing stale IPs after backend container restarts.
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/ws/lsp/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;

        # Keep parity with long-running GraphQL requests and LSP sessions.
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- BACKEND API (GraphQL) ---
    # GraphQL is protected by JWT authentication, no IP restriction needed
    location /graphql {
        # Allow larger request bodies for base64-encoded file uploads (strAIn document analysis)
        # Base64 encoding increases file size by ~33%, so 10MB file becomes ~13MB
        # Adding overhead for JSON structure, set limit to 20MB
        client_max_body_size 20M;

        # Variable-based proxy_pass forces nginx to re-resolve via the resolver directive
        # on each request, preventing stale IPs after backend container restarts.
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/graphql;
        proxy_http_version 1.1;
        # Explicitly set all required proxy headers (child location blocks do NOT
        # inherit proxy_set_header from the parent server block in nginx)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Hefaistos-Authorization $http_x_hefaistos_authorization;
        proxy_set_header X-Forwarded-Authorization $http_x_forwarded_authorization;
        
        # Extended timeouts for long-running operations (AI processing)
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- Coverage Layer JSON for ATT&CK Navigator ---
    # CORS is handled by Django (django-cors-headers + CORSPrivateNetworkMiddleware)
    # Do NOT add CORS headers here — duplicates cause browsers to reject the response.
    location /api/coverage/ {
        set $backend_upstream http://backend:8000;
        # Preserve original request URI when proxying via variable upstream.
        # Appending a path here can collapse subpaths (e.g. /layer.json) and
        # cause upstream 404 responses.
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Hefaistos-Authorization $http_x_hefaistos_authorization;
        proxy_set_header X-Forwarded-Authorization $http_x_forwarded_authorization;
    }

    # --- BACKEND API (REST endpoints) ---
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Hefaistos-Authorization $http_x_hefaistos_authorization;
        proxy_set_header X-Forwarded-Authorization $http_x_forwarded_authorization;
    }

    # --- GraphiQL static assets ---
    # CRA also serves /static/*; narrowly route Graphene's assets here.
    location /static/graphene_django/ {
        alias /var/www/static/graphene_django/;
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    # --- BACKEND API (Django Admin) - SINGLE IP ONLY ---
    # Canonicalize `/admin` to `/admin/` first.
    location = /admin {
        return 301 /admin/;
    }

    # Restrict admin panel access to one explicitly allowed public IP.
    location ^~ /admin/ {
        allow 185.91.166.204;
        deny all;

        set $backend_upstream http://backend:8000;
        # Keep the original request URI when using variable-based upstreams.
        # Using `proxy_pass $backend_upstream/admin;` would force every
        # request (/admin/, /admin/login/, ...) to `/admin` upstream,
        # triggering Django's canonical slash redirect loop.
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Django Admin static files - SINGLE IP ONLY ---
    # Serve admin CSS/JS directly from collected static files.
    location ^~ /static/admin/ {
        allow 185.91.166.204;
        deny all;
        
        alias /var/www/static/admin/;
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    # --- User-uploaded media (snapshots, avatars) ---
    # Serve directly from the shared media volume for better performance
    location /media/ {
        alias /var/www/media/;
        expires 1h;
        add_header Cache-Control "public";
        # Security: do not execute scripts in the media directory
        add_header X-Content-Type-Options nosniff;

        # CORS headers for cross-origin requests
        # Allow all origins for media files (read-only public resources)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
    }

    # Note: Do NOT route `/static/` globally to backend; CRA serves frontend assets under `/static/*`.
    # Backend static is exposed only via narrow prefixes above (e.g., `/static/admin/`).

}
