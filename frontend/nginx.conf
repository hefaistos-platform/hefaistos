server {
    listen 80;
    server_name _;

    # Serve built assets
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ATT&CK Navigator bundle is served as a separate static app under /navigator/
    location = /navigator {
        return 301 /navigator/;
    }

    location /navigator/ {
        try_files $uri $uri/ /navigator/index.html;
    }

    # SPA fallback: serve index.html for any route not matching a file
    location / {
        try_files $uri /index.html;
    }
}
