name: Create Stable Release Tag

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit SHA on release branch to tag (defaults to current main HEAD; falls back to sharp)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target and version
        id: resolve
        run: |
          set -Eeuo pipefail

          git fetch origin main --no-tags || true
          git fetch origin sharp --no-tags || true

          if git show-ref --verify --quiet refs/remotes/origin/main; then
            release_branch="main"
          elif git show-ref --verify --quiet refs/remotes/origin/sharp; then
            release_branch="sharp"
          else
            echo "No supported release branch found (expected origin/main or origin/sharp)." >&2
            exit 1
          fi

          input_sha="${{ github.event.inputs.target_sha }}"
          if [[ -n "${input_sha}" ]]; then
            target_sha="${input_sha}"
          else
            target_sha="$(git rev-parse "origin/${release_branch}")"
          fi

          git rev-parse --verify "${target_sha}^{commit}" >/dev/null

          if ! git merge-base --is-ancestor "${target_sha}" "origin/${release_branch}"; then
            echo "Target SHA is not reachable from origin/${release_branch}: ${target_sha}" >&2
            exit 1
          fi

          version="$(git show "${target_sha}:VERSION" | tr -d '[:space:]')"
          scripts/versioning.sh validate "${version}" >/dev/null
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag already exists: ${tag}" >&2
            exit 1
          fi

          {
            echo "release_branch=${release_branch}"
            echo "target_sha=${target_sha}"
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create and push tag
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          TAG_NAME: ${{ steps.resolve.outputs.tag }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" "${TARGET_SHA}" -m "HEFAISTOS PRO ${TAG_NAME}"
          git push origin "${TAG_NAME}"

      - name: Release summary
        run: |
          {
            echo "## Stable Release Tag Created"
            echo ""
            echo "- Source branch: \`${{ steps.resolve.outputs.release_branch }}\`"
            echo "- Tag: \`${{ steps.resolve.outputs.tag }}\`"
            echo "- Version: \`${{ steps.resolve.outputs.version }}\`"
            echo "- Commit: \`${{ steps.resolve.outputs.target_sha }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
