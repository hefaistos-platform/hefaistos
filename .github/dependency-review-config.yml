# Fail PR if restrictive licenses are found in either
# runtime or development dependencies.
fail-on-scopes:
  - runtime
  - development

# List of prohibited SPDX license identifiers
deny-licenses:
  - AGPL-1.0-only
  - AGPL-1.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - SSPL-1.0
  - OSL-3.0
  - CC-BY-NC-4.0
